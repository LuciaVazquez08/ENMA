[theme]
# --- Tema extraído de encuestamigrante.ar (bloque :root del CSS) ---
# Color principal: naranja marca (--o1)
primaryColor = "#FF7900"

# Fondo general de la app (blanco, igual que .enma-page)
backgroundColor = "#FFFFFF"

# Fondo secundario: sidebar, cards, contenedores (tono muy claro, cercano a --blue-pale / #E6E9F2)
secondaryBackgroundColor = "#F5F7FB"

# Color de texto principal (--text)
textColor = "#0F0F1A"

# Tipografía base. Streamlit usa por defecto "sans serif" del sistema;
# para usar DM Sans real, sumamos [[theme.fontFaces]] abajo (Streamlit >= 1.39)
# y referenciamos la familia acá.
font = "DM Sans"

[[theme.fontFaces]]
family = "DM Sans"
url = "https://fonts.gstatic.com/s/dmsans/v15/rP2tp2ywxg089UriI5-g4vlH9VoD8CmcqZG40F9JadbnoEwAopxRvbo.ttf"
weight = 400

[[theme.fontFaces]]
family = "DM Sans"
url = "https://fonts.gstatic.com/s/dmsans/v15/rP2tp2ywxg089UriI5-g4vlH9VoD8CmcqZG40F9JadbnoEwAopxRvbo.ttf"
weight = 700

[[theme.fontFaces]]
family = "Syncopate"
url = "https://fonts.gstatic.com/s/syncopate/v22/pe0sMImSLYBIv1o4X1M8cce9I9tqbg.ttf"
weight = 700
